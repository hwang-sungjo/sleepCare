name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Deploy frontend (S3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Generate Environment Variables
        working-directory: ./frontend
        run: |
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" > .env.production

      - name: Build Project
        working-directory: ./frontend
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AI_AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync ./frontend/dist/ s3://sleepcare-frontend --delete

  deploy-backend:
    name: Deploy backend (Lambda)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Lambda fat jar
        working-directory: ./spring-server
        run: ./gradlew clean shadowJar -Pprofile=lambda --no-daemon

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AI_AWS_REGION }}

      - name: Publish jar to Lambda
        env:
          FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
          DEPLOY_BUCKET: ${{ secrets.LAMBDA_DEPLOY_S3_BUCKET }}
        run: |
          set -euo pipefail
          JAR="spring-server/build/libs/server-0.0.1-SNAPSHOT-all.jar"
          if [ ! -f "$JAR" ]; then
            echo "Missing artifact: $JAR"
            exit 1
          fi
          if [ -z "${FUNCTION_NAME}" ]; then
            echo "Set repository secret LAMBDA_FUNCTION_NAME to your Lambda function name."
            exit 1
          fi

          if [ -n "${DEPLOY_BUCKET}" ]; then
            KEY="lambda-deploy/${GITHUB_SHA}/server-all.jar"
            aws s3 cp "$JAR" "s3://${DEPLOY_BUCKET}/${KEY}"
            aws lambda update-function-code \
              --function-name "${FUNCTION_NAME}" \
              --s3-bucket "${DEPLOY_BUCKET}" \
              --s3-key "${KEY}"
          else
            SIZE_MB=$(( $(stat -c%s "$JAR") / 1024 / 1024 ))
            if [ "${SIZE_MB}" -ge 50 ]; then
              echo "Jar is ${SIZE_MB}MB (>= 50MB). Set LAMBDA_DEPLOY_S3_BUCKET secret for S3-based deploy."
              exit 1
            fi
            aws lambda update-function-code \
              --function-name "${FUNCTION_NAME}" \
              --zip-file "fileb://${JAR}"
          fi

          aws lambda wait function-updated --function-name "${FUNCTION_NAME}"
          echo "Lambda updated: ${FUNCTION_NAME}"
