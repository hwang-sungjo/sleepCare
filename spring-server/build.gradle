plugins {
	id 'java'
	id 'org.springframework.boot' version '3.0.6'
	id 'io.spring.dependency-management' version '1.1.0'
	// Lambda 호환 fat jar (클래스가 jar root 에 위치, BOOT-INF/classes/ 사용 X)
	id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

def isLambda = project.findProperty('profile') == 'lambda'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Bean Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// DB
	runtimeOnly 'com.mysql:mysql-connector-j'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Lombok — pin to a version that supports JDK 21+ (Spring Boot 3.0.6 BOM ships 1.18.26 which breaks on JDK 21)
	compileOnly 'org.projectlombok:lombok:1.18.34'
	annotationProcessor 'org.projectlombok:lombok:1.18.34'
	testImplementation 'org.projectlombok:lombok:1.18.34'

	// JWT / Security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.2'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.2', 'io.jsonwebtoken:jjwt-jackson:0.11.2'

	// Swagger annotations only (compile-time, ~60 KB) — UI/scanner excluded from lambda build below
	implementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.15'

	// MQTT (lambda 에서는 @Profile("!lambda") 로 빈만 비활성, 의존성은 유지)
	implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

	// AWS Lambda + API Gateway proxy for Spring Boot 3
	implementation 'com.amazonaws.serverless:aws-serverless-java-container-springboot3:2.1.3'

	// AWS SDK v2 — Bedrock(KB RAG)/S3(페르소나 프롬프트)
	implementation platform('software.amazon.awssdk:bom:2.25.70')
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:bedrockagentruntime'
	implementation 'software.amazon.awssdk:bedrockruntime'

	// ★ Excluded from lambda build to keep jar under the 50 MB console-upload limit
	if (!isLambda) {
		runtimeOnly 'com.h2database:h2'
		implementation 'me.paulschwarz:spring-dotenv:4.0.0'
		implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.4'
	}

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
}

bootRun {
	workingDir = file('..')
	args = ["--spring.profiles.active=${project.findProperty('profile') ?: 'local-h2'}"]
}

// Lambda 배포용 fat jar — 클래스가 jar root 에 위치 (Lambda Java runtime 호환)
// 사용: gradlew clean shadowJar -Pprofile=lambda
//   → build/libs/server-0.0.1-SNAPSHOT-all.jar (Lambda 콘솔 업로드)
shadowJar {
	archiveClassifier = 'all'
	mergeServiceFiles()

	// ★ Spring Boot 3.x 의 autoconfig 메타파일들 — 여러 의존성 jar 에서 같은 경로로 들어있어
	//   shadowJar 가 기본적으로 첫 파일만 살리는데, 그러면 Spring 부팅 시 절반의 autoconfig 가 사라져
	//   Runtime.BadFunctionCode (static init 실패) 발생. append 로 모든 jar 의 내용을 합쳐야 함.
	append 'META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports'
	append 'META-INF/spring/org.springframework.boot.env.PropertySourceLoader.imports'
	append 'META-INF/spring/org.springframework.boot.diagnostics.FailureAnalyzer.imports'
	append 'META-INF/spring/org.springframework.boot.context.properties.ConfigurationProperties.imports'
	append 'META-INF/spring.handlers'
	append 'META-INF/spring.schemas'
	append 'META-INF/spring.tooling'

	// spring.factories (Spring Boot 2.x 호환, 일부 transitive 에 남아있음) — Properties 형식이라 별도 transformer (FQN 사용)
	transform(com.github.jengelman.gradle.plugins.shadow.transformers.PropertiesFileTransformer) {
		paths = ['META-INF/spring.factories']
		mergeStrategy = 'append'
	}

	manifest {
		attributes 'Main-Class': 'project.server.SleepCareServerApplication'
	}
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
}
